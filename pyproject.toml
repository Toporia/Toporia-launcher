[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toporia"
version = "0.1.0"
description = "Open-source topology optimisation platform with benchmarks and a live GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["topology optimisation", "structural optimisation", "finite element", "SIMP"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "Pillow>=9.0",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]
# Enables method="pymoto": compliance minimisation with pyMOTO's module network,
# which computes sensitivities by backpropagation instead of by hand.
pymoto = ["pymoto>=2.0"]

[project.scripts]
toporia = "toporia.cli:main"


# ── Test suite ────────────────────────────────────────────────────────────────
# The golden tests in tests/ are characterisation tests: they pin current
# behaviour so the architecture work can be verified mechanically.  See
# tests/regenerate_baselines.py before changing any stored baseline.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Escalate our own numerical warnings, but do not fail on a dependency's.
filterwarnings = ["error::RuntimeWarning:toporia.*"]

# ── Linting ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["results", ".venv"]

[tool.ruff.lint]
# Conservative starting set: real bug classes (F, B), import hygiene (I),
# and basic style (E, W, UP).  Widen this as the codebase is restructured.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length is handled by the formatter, not the linter
    "E741",  # ambiguous names like `l1`/`l2` are idiomatic in the OC bisection

    # ── Deferred to Phase 1, not accepted as permanent ──────────────────────
    # 83 occurrences of a deliberate compact style (`def get_density(self): return ...`,
    # `axes[0].plot(x); axes[0].set_ylabel(y)`). Reformatting them in Phase 0 would be a
    # large diff with no behavioural value and would obscure the real refactor diffs.
    "E701",  # if x: return
    "E702",  # a; b
    # 3 real but subtle cases - zip() lengths may legitimately differ. Each needs a
    # decision, not a blanket fix.
    "B905",
    "B027",  # empty non-abstract method on Filter ABC; revisited when the ABC is redefined
]

[tool.ruff.lint.per-file-ignores]
# Test modules import after calling matplotlib.use("Agg"), which must come first.
"tests/*" = ["E402"]
