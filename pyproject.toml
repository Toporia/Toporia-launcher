[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toporia"
version = "0.3.0"
description = "Open-source topology optimisation platform with benchmarks and a live GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["topology optimisation", "structural optimisation", "finite element", "SIMP"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "Pillow>=9.0",
]

[project.optional-dependencies]
# The desktop app (toporia_gui). The core and the library run, check and test without it.
gui = ["PySide6>=6.5"]
dev = ["pytest>=7", "ruff"]
# Enables method="pymoto": compliance minimisation with pyMOTO's module network,
# which computes sensitivities by backpropagation instead of by hand.
pymoto = ["pymoto>=2.0"]
# Enables the updaters nlopt_mma, nlopt_ccsaq, nlopt_slsqp and nlopt_auglag (NLopt's
# gradient-based constrained optimisers), e.g. method="q4+nlopt_mma".
nlopt = ["nlopt"]
# GPL-3 optimisers, kept as extras the user chooses to install.  Toporia (Apache-2.0)
# never bundles or requires them; they are imported only when their updater runs.
# Enables updaters mmapy_mma and mmapy_gcmma (Svanberg's MMA/GCMMA, Python port).
mmapy = ["mmapy>=0.3"]
# Enables updater nullspace (Feppon's null-space optimiser for constrained problems).
nullspace = ["nullspace_optimizer>=1.3"]
# 3-D: pyamg is the multigrid solver for large 3-D meshes (the direct solver
# handles small ones without it); scikit-image draws the 3-D view of a design.
3d = ["pyamg>=5.0", "scikit-image>=0.22"]
# Optional interactive spatial editor and geometry import. Headless 2D remains usable without these.
gui3d = ["toporia[gui]", "pyvista>=0.47", "pyvistaqt>=0.11", "ezdxf>=1.4"]
# Builds the Windows program (python packaging/build_windows.py); not needed to run Toporia.
build = ["pyinstaller>=6.10"]

[project.scripts]
toporia = "toporia_core.cli:main"

# Toporia's own library is a source of parts like any installed package: the core finds
# it through these entry points and never imports it by name (toporia_core/framework/registry.py).
[project.entry-points."toporia.methods"]
toporia = "toporia_library.methods"
[project.entry-points."toporia.models"]
toporia = "toporia_library.models"
[project.entry-points."toporia.updaters"]
toporia = "toporia_library.updaters"
[project.entry-points."toporia.filters"]
toporia = "toporia_library.filters"
[project.entry-points."toporia.interpolations"]
toporia = "toporia_library.interpolations"
[project.entry-points."toporia.responses"]
toporia = "toporia_library.responses"
[project.entry-points."toporia.representations"]
toporia = "toporia_library.representations"
[project.entry-points."toporia.schedules"]
toporia = "toporia_library.schedules"
[project.entry-points."toporia.postprocessors"]
toporia = "toporia_library.postprocessors"
[project.entry-points."toporia.problems"]
toporia = "toporia_library.problems"
# The desktop app, which `toporia` (no command) starts.
[project.entry-points."toporia.apps"]
gui = "toporia_gui:launch"

# Three packages: the core (framework, engine, checks, command line), the library of
# functions and presets, and the desktop GUI.  The core never imports the other two.
[tool.hatch.build.targets.wheel]
packages = ["toporia_core", "toporia_library", "toporia_gui"]


# ── Test suite ────────────────────────────────────────────────────────────────
# The golden tests in tests/ are characterisation tests: they pin current
# behaviour so the architecture work can be verified mechanically.  See
# tests/golden/regenerate_baselines.py before changing any stored baseline.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Escalate our own numerical warnings, but do not fail on a dependency's.
filterwarnings = ["error::RuntimeWarning:toporia.*"]

# ── Linting ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["results", ".venv"]

[tool.ruff.lint]
# Real bug classes (F, B), import hygiene (I), and basic style (E, W, UP).
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length is handled by the formatter, not the linter
    "E741",  # ambiguous names like `l1`/`l2` are idiomatic in the OC bisection
    "B027",  # optional hooks on the abstract bases (Filter.setup, Filter.step, Model.advance,
             # close) are empty on purpose: a part overrides only the ones it needs
]

[tool.ruff.lint.per-file-ignores]
# Test modules import after calling matplotlib.use("Agg"), which must come first.
"tests/*" = ["E402"]
